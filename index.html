<script>



var audio = new Audio('audio.mp3');
audio.loop = true;
audio.volume = 0.5;




var targetDate = new Date("Jul 18, 2026 20:00:00").getTime();
var countdownTimer = countdown(
    targetDate,
    function(ts) {
        var countdownText = `
            <div class="time-container mr_10">
                <span class="fspx_30">${ts.days}</span>
                <p>Días</p>
            </div>
            <div class="time-container mr_10">
                <span class="fspx_30">${ts.hours}</span>
                <p>Horas</p>
            </div>
            <div class="time-container mr_10">
                <span class="fspx_30">${ts.minutes}</span>
                <p>Minutos</p>
            </div>
            <div class="time-container">
                <span class="fspx_30">${ts.seconds}</span>
                <p>Segundos</p>
            </div>
        `;

        document.getElementById("countdown").innerHTML = countdownText;
    },
    countdown.DAYS | countdown.HOURS | countdown.MINUTES | countdown.SECONDS
);






let muted = false;
$('#sound,#play').click(() => {

    muted = !muted;
    if (muted) {
        audio.play();
    } else {
        audio.pause();
    }
    $('#sound').find('img').attr('src', muted ? 'sound.svg' : 'sound_mute.svg');

});









document.addEventListener('DOMContentLoaded', function() {

    floatingController.register('#controls', '.content', {
        width: 80,
        customPosition: (element, container, breakpoint) => {
            const rect = container.getBoundingClientRect();
            element.style.right = rect.left + 'px';
            element.style.bottom = '0px';
        }
    });

});
